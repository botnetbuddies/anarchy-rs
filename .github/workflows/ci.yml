name: CI

on:
  push:
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    name: Parity gate + static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting, lint, documentation and unit tests
        run: make check

      - name: Build release bundle
        run: make dist

      - name: Verify the binary is fully static
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/username-anarchy-rs
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::binary has a PT_INTERP segment (not statically linked)"
            exit 1
          fi
          if ! ldd "$BIN" 2>&1 | grep -q "statically linked"; then
            echo "::error::binary is not statically linked"
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::binary has DT_NEEDED entries"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/username-anarchy-rs
          "$BIN" anna key | grep -qx anna
          "$BIN" --country france -a | grep -qx michel
          "$BIN" --list-formats | grep -q firstlast
          "$BIN" -s on --given-names vendor/username-anarchy/names/facebook/firstnames-top100.txt \
                        --family-names vendor/username-anarchy/names/facebook/lastnames-top100.txt \
                        -f firstlast "" | head -1 | grep -q .

      - name: Parity gate against the Ruby oracle
        run: make test

      - name: Forced-parallel parity gate
        run: make test
        env:
          USERNAME_ANARCHY_THREADS: "4"
          USERNAME_ANARCHY_MIN_PARALLEL: "0"

      - name: Upload the static binary
        uses: actions/upload-artifact@v4
        with:
          name: username-anarchy-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/username-anarchy-rs
          if-no-files-found: error
          retention-days: 14
