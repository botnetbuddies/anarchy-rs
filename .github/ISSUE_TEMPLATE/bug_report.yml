name: Bug report
description: Report a problem with anarchy-rs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include a command and a small input example that reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: Describe what you expected to happen.
      render: text
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, how the binary was built or installed.
      placeholder: "Ubuntu 24.04 x86_64, release tarball"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
