[package]
name = "anarchy-rs"
version = "0.6.0"
edition = "2021"
description = "Rust port of Username Anarchy, a username generator"
license = "MIT"

[[bin]]
name = "anarchy-rs"
path = "src/main.rs"

[dependencies]
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true
